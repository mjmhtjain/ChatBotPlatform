services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chatbot_test
      POSTGRES_PASSWORD: chatbot_test
      POSTGRES_DB: chatbot_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot_test -d chatbot_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend-test:
    build: ../backend
    ports:
      - "8081:8080"
    environment:
      ADMIN_EMAIL: user@gmail.com
      ADMIN_PASSWORD: password
      JWT_SECRET: test-secret
      CORS_ORIGIN: http://localhost:3001
      POSTGRES_HOST: postgres-test
      POSTGRES_PORT: 5432
      POSTGRES_USER: chatbot_test
      POSTGRES_PASSWORD: chatbot_test
      POSTGRES_DB: chatbot_test
    depends_on:
      postgres-test:
        condition: service_healthy
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080/api/auth/login 2>&1; test $? -le 8"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend-test:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: http://localhost:8081
    ports:
      - "3001:3000"
    depends_on:
      backend-test:
        condition: service_healthy
